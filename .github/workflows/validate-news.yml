name: Validate news

on:
  push:
    paths:
      - "latest/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
      - "package.json"
  pull_request:
    paths:
      - "latest/**"
      - "scripts/**"
      - "templates/**"
      - ".github/workflows/**"
      - "package.json"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate latest news
        run: npm run validate
      - name: Prepare LINE message (dry run)
        run: npm run prepare

